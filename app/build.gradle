plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yuyu.bongocat'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.yuyu.bongocat'
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName '3.13'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        existingDebug {
            // 直接复用 v3.5/v3.6 的密钥，不允许退回自动生成的调试签名。
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.existingDebug }
        release {
            signingConfig signingConfigs.existingDebug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            workingDir project.projectDir
            systemProperty 'bongocat.projectDir', rootProject.projectDir.absolutePath
            inputs.file(rootProject.file('rive/scene.rml'))
            inputs.file(rootProject.file('rive/rive.yaml'))
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'app.rive:rive-android:11.16.3'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.9.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'com.google.code.gson:gson:2.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}

tasks.register('verifyRiveAsset') {
    def asset = file('src/main/res/raw/bongocat.riv')
    def manifest = rootProject.file('rive/export.sha256')
    inputs.files(asset, manifest, rootProject.file('rive/scene.rml'), rootProject.file('rive/rive.yaml'))
    doLast {
        if (!asset.isFile() || !manifest.isFile()) {
            throw new GradleException('Missing exported Rive model. Run rive login, then powershell -File tools/export-rive.ps1.')
        }
        def expectedFiles = ['scene.rml', 'rive.yaml', '../app/src/main/res/raw/bongocat.riv'] as Set
        def recordedFiles = [] as Set
        manifest.eachLine('UTF-8') { line ->
            def entry = line.split('  ', 2)
            if (entry.length != 2 || !expectedFiles.contains(entry[1])) {
                throw new GradleException('Invalid rive/export.sha256; run tools/export-rive.ps1 again.')
            }
            def source = new File(rootProject.file('rive'), entry[1])
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()
            if (hash != entry[0]) throw new GradleException("Stale Rive export: ${entry[1]}. Run tools/export-rive.ps1 again.")
            recordedFiles.add(entry[1])
        }
        if (recordedFiles != expectedFiles) throw new GradleException('Incomplete Rive export manifest.')
    }
}

tasks.named('preBuild').configure { dependsOn 'verifyRiveAsset' }
