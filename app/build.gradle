plugins {
    id 'com.android.application'
}

def releaseSigningFile = rootProject.file('.signing/release.properties')
def releaseSigning = new Properties()
if (releaseSigningFile.isFile()) releaseSigningFile.withInputStream { releaseSigning.load(it) }
def trustedSigner = rootProject.file('security/signer.sha256').text.trim()
if (!(trustedSigner ==~ /[0-9a-f]{64}/)) throw new GradleException('Invalid security/signer.sha256')

android {
    namespace 'com.yuyu.bongocat'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.yuyu.bongocat'
        minSdk 26
        targetSdk 34
        versionCode 26
        versionName '3.23'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'SIGNING_CERT_SHA256', '"' + trustedSigner + '"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        existingDebug {
            // 本地调试沿用旧密钥；发布版本读取独立的私密配置。
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        verifiedRelease {
            storeFile rootProject.file(releaseSigning.getProperty('storeFile', '.signing/release.p12'))
            storeType 'PKCS12'
            storePassword releaseSigning.getProperty('storePassword')
            keyAlias releaseSigning.getProperty('keyAlias')
            keyPassword releaseSigning.getProperty('keyPassword')
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.existingDebug }
        release {
            signingConfig signingConfigs.verifiedRelease
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            workingDir project.projectDir
            systemProperty 'bongocat.projectDir', rootProject.projectDir.absolutePath
            inputs.file(rootProject.file('rive/scene.rml'))
            inputs.file(rootProject.file('rive/rive.yaml'))
            inputs.file(rootProject.file('security/bongocat-signing-cert.pem'))
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
}

tasks.register('verifyReleaseSigning') {
    doLast {
        if (!releaseSigningFile.isFile() || ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].any { !releaseSigning.getProperty(it) }) {
            throw new GradleException('Release signing requires local .signing/release.properties; see security/README.md.')
        }
        def keyStore = java.security.KeyStore.getInstance('PKCS12')
        rootProject.file(releaseSigning.getProperty('storeFile')).withInputStream {
            keyStore.load(it, releaseSigning.getProperty('storePassword').toCharArray())
        }
        def certificate = keyStore.getCertificate(releaseSigning.getProperty('keyAlias'))
        if (certificate == null || !keyStore.isKeyEntry(releaseSigning.getProperty('keyAlias'))) {
            throw new GradleException('Missing release signing key.')
        }
        def fingerprint = java.security.MessageDigest.getInstance('SHA-256').digest(certificate.encoded).encodeHex().toString()
        if (fingerprint != trustedSigner) throw new GradleException('Release signing identity does not match security/signer.sha256.')
    }
}
tasks.configureEach { if (name == 'preReleaseBuild') dependsOn 'verifyReleaseSigning' }

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'app.rive:rive-android:11.16.3'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.9.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'com.google.code.gson:gson:2.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}

tasks.register('verifyRiveAsset') {
    def asset = file('src/main/res/raw/bongocat.riv')
    def manifest = rootProject.file('rive/export.sha256')
    inputs.files(asset, manifest, rootProject.file('rive/scene.rml'), rootProject.file('rive/rive.yaml'))
    doLast {
        if (!asset.isFile() || !manifest.isFile()) {
            throw new GradleException('Missing exported Rive model. Run rive login, then powershell -File tools/export-rive.ps1.')
        }
        def expectedFiles = ['scene.rml', 'rive.yaml', '../app/src/main/res/raw/bongocat.riv'] as Set
        def recordedFiles = [] as Set
        manifest.eachLine('UTF-8') { line ->
            def entry = line.split('  ', 2)
            if (entry.length != 2 || !expectedFiles.contains(entry[1])) {
                throw new GradleException('Invalid rive/export.sha256; run tools/export-rive.ps1 again.')
            }
            def source = new File(rootProject.file('rive'), entry[1])
            def hash = java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()
            if (hash != entry[0]) throw new GradleException("Stale Rive export: ${entry[1]}. Run tools/export-rive.ps1 again.")
            recordedFiles.add(entry[1])
        }
        if (recordedFiles != expectedFiles) throw new GradleException('Incomplete Rive export manifest.')
    }
}

tasks.named('preBuild').configure { dependsOn 'verifyRiveAsset' }
